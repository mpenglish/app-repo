apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: tenant-a
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: tenant-a
spec:
  selector:
    app: backend
  ports:
    - port: 8080
---
# 1. Isolate the namespace (Only allow ingress and self)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: isolate-tenant-a
  namespace: tenant-a
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["tenant-a", "istio-ingress"]
---
# 2. Expose Frontend to the Gateway API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: tenant-a
spec:
  parentRefs:
  - name: external-gateway # Refers to the Gateway in infra-repo
    namespace: istio-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-svc
      port: 80