name: Build and Publish App Workloads

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'manifests/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up ORAS CLI
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Generate Global Tag
        id: vars
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.SHA_TAG }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:buildcache,mode=max

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:${{ env.SHA_TAG }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache,mode=max

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Mutate Tags and Package Manifests
        run: |
          cd manifests
          
          # Inject the new SHA tags into the YAML
          kustomize edit set image my-frontend-image=docker.io/${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.SHA_TAG }}
          kustomize edit set image my-backend-image=docker.io/${{ secrets.DOCKER_USERNAME }}/backend:${{ env.SHA_TAG }}
          
          # Package the mutated manifests
          tar -czvf /tmp/app-manifests.tar.gz .

      - name: Push Manifest Artifact to OCI Registry
        run: |
          # Use raw ORAS to push the packaged manifests (login reuses Docker creds via config.json)
          echo "${{ secrets.DOCKER_PAT }}" | oras login registry-1.docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          # Push versioned audit tag
          oras push registry-1.docker.io/${{ secrets.DOCKER_USERNAME }}/app-manifests:${{ env.SHA_TAG }} \
            /tmp/app-manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip --disable-path-validation
          
          # Push 'latest' tag for Argo CD sync
          oras push registry-1.docker.io/${{ secrets.DOCKER_USERNAME }}/app-manifests:latest \
            /tmp/app-manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip --disable-path-validation